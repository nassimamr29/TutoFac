spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tutofac}
    username: ${DB_USER:tutofac}
    password: ${DB_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # Partie 4 : serveur SMTP (Mailpit en local via docker compose)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # Délais en ms : un serveur SMTP qui ne répond pas ne bloque pas la requête
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  mail:
    from: ${MAIL_FROM:noreply@tutofac.fr}
    # Rappel des séances du lendemain, chaque jour à 18h
    rappel-cron: ${MAIL_RAPPEL_CRON:0 0 18 * * *}
