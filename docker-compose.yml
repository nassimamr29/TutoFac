services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      # Front Docker (3000) et front Vite en dev (5173)
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - releves:/app/uploads/releves
    ports:
      - "8080:8080"

  # Front React buildé, servi par Nginx qui relaie /api vers le backend
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  # Faux serveur SMTP de dev : les mails envoyés sont visibles sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      # SMTP accessible aussi pour un backend lancé hors Docker (mvn spring-boot:run)
      - "1025:1025"

volumes:
  pgdata:
  releves: